# Weblate component configuration for compcon-locales

project:
  name: COMP/CON
  slug: compcon
  source_language: en

defaults:
  repo: weblate://compcon/ui
  branch: master
  push_branch: weblate
  merge_style: rebase
  file_format: json
  new_lang: add
  language_regex: '^[^.]+$'
  file_format_params:
    dos_eol: false
    json_indent: 4
    json_sort_keys: "none"
    json_indent_style: "spaces"
    json_use_compact_separators: false

components:
  - name: "UI"
    slug: ui
    repo: https://github.com/massif-press/compcon-locales
    filemask: ui/*.json
    template: ui/en.json
    file_format: i18nextv4
    edit_template: true
    manage_units: false
    flags: 'vue-format, ignore-i18next-interpolation'
    enforced_checks: [placeholders, xml-tags, xml-invalid]
    variant_regex: 'placeholders:r"@:\{''[\w.]+''\}"'
    allow_translation_propagation: false

  - name: "Glossary"
    slug: glossary
    filemask: glossary/*.csv
    template: glossary/en.csv
    file_format: csv
    is_glossary: true
    edit_template: true
    manage_units: true

  # English base generated from @massif/lancer-data
  - name: "CRB Compendium"
    slug: lancer-data
    filemask: content/lancer-data/*.json
    template: content/lancer-data/en.json
    edit_template: true
    manage_units: true
    enforced_checks: [placeholders, xml-tags, xml-invalid]

  # English base generated from the in-app SRD reference (src/assets/srd)
