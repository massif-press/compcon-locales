# Weblate component configuration for compcon-locales

project:
  name: CompCon
  slug: compcon
  push_branch: weblate
  source_language: en

defaults:
  file_format: json
  base_is_readonly: true
  checks:
    - placeholders
    - same
    - punctuation_spacing

components:
  - name: UI
    slug: ui
    filemask: ui/*.json
    template: ui/en.json
    new_base: ui/en.json
    file_format: i18nextv4
    flags: 'vue-format, ignore-i18next-interpolation'
    addons:
      - weblate.cleanup.generic
    # Settings > Files > file format parameters (replaced the "Customize JSON output" add-on in Weblate 5.13)
    file_format_params:
      json_indent: 4
      json_indent_style: spaces
      json_sort_keys: none

  # English base generated from @massif/lancer-data
  - name: CRB Compendium
    slug: lancer-data
    filemask: content/lancer-data/*.json
    template: content/lancer-data/en.json
    new_base: content/lancer-data/en.json

  # English base generated from the in-app SRD reference (src/assets/srd)
  - name: CRB Reference
    slug: lancer-srd
    filemask: content/lancer-srd/*.json
    template: content/lancer-srd/en.json
    new_base: content/lancer-srd/en.json

  # English base generated from @massif/wallflower-data via build-llp extract
  - name: "Lancer Wallflower Data"
    slug: wallflower-data
    filemask: content/wallflower-data/*.json
    template: content/wallflower-data/en.json
    new_base: content/wallflower-data/en.json

  # English base generated from @massif/ktb-data via build-llp extract
  - name: "Lancer KTB Data"
    slug: ktb-data
    filemask: content/ktb-data/*.json
    template: content/ktb-data/en.json
    new_base: content/ktb-data/en.json

  # English base generated from @massif/dustgrave-data via build-llp extract
  - name: "LANCER: Dustgrave"
    slug: dustgrave-data
    filemask: content/dustgrave-data/*.json
    template: content/dustgrave-data/en.json
    new_base: content/dustgrave-data/en.json
    flags: 'placeholders:r"\{[^}]*\}|\d+/\d+/\d+"'

  # English base generated from @massif/sotw-data via build-llp extract
  - name: "Shadow of the Wolf"
    slug: sotw-data
